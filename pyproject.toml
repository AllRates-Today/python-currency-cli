[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-cli"
version = "1.0.0"
description = "Command-line currency converter using official central bank rates. No API key needed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
currency = "currency_cli.cli:main"

[tool.setuptools.packages.find]
include = ["currency_cli*"]
